<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Happy Birthday Mahi 🎉</title>
  <meta name="description" content="A beautiful birthday surprise for Mahi — open the gift!" />
  <style>
    /* ===========================
       Reset & Base
       =========================== */
    :root{
      --bg1: #0f1724;
      --bg2: #3b2f63;
      --card-bg: rgba(255,255,255,0.06);
      --accent1: #ff8fb1;
      --accent2: #7be6ff;
      --accent3: #ffd36b;
      --glass: rgba(255,255,255,0.06);
      --glass-2: rgba(255,255,255,0.03);
      --text: #f7f9fb;
      --muted: rgba(247,249,251,0.75);
      --success: #7ef7b8;
      --shadow: 0 8px 30px rgba(2,6,23,0.6);
      --radius: 16px;
      --mobile-break: 640px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
      background: radial-gradient(1200px 600px at 10% 10%, rgba(255,140,165,0.08), transparent 8%),
                  radial-gradient(800px 400px at 90% 90%, rgba(123,230,255,0.04), transparent 8%),
                  linear-gradient(160deg, var(--bg1), var(--bg2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
    }

    /* ===========================
       Decorative layers: emoji-fall & balloons
       =========================== */
    /* Container that holds falling emoji particles behind UI */
    .emoji-layer, .confetti-canvas{
      position:fixed;
      top:0;left:0;right:0;bottom:0;
      pointer-events:none; /* never block clicks */
      z-index:0; /* behind main UI which uses z-index: 10+ */
    }

    /* floating balloons background */
    .balloons {
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      overflow:hidden;
    }
    .balloon {
      position:absolute;
      font-size:48px;
      opacity:0.9;
      transform-origin:center;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
      will-change: transform;
    }
    /* gentle float animation */
    @keyframes floaty {
      0% { transform: translateY(0) translateX(0) rotate(0deg); opacity:0.95 }
      50% { transform: translateY(-18px) translateX(6px) rotate(3deg); opacity:1 }
      100% { transform: translateY(0) translateX(0) rotate(0deg); opacity:0.95 }
    }

    /* ===========================
       Page layout
       =========================== */
    .page {
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:40px;
      z-index:10; /* above emoji & balloons */
    }

    .card {
      width:100%;
      max-width:980px;
      border-radius:var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      padding:36px;
      display:flex;
      gap:24px;
      align-items:center;
      justify-content:space-between;
    }
    @media (max-width:900px){
      .card{flex-direction:column;padding:24px}
    }

    /* ===========================
       Heading / Title with glow & subtle anim
       =========================== */
    header.hero {
      flex:1;
      text-align:center;
      position:relative;
      z-index:12;
    }
    h1.title {
      margin:0 0 12px 0;
      font-size: clamp(28px, 6vw, 48px);
      line-height:1.02;
      letter-spacing: -0.02em;
      font-weight:700;
      color:var(--text);
      text-shadow:
        0 6px 30px rgba(0,0,0,0.6),
        0 0 18px rgba(255,255,255,0.02);
    }

    /* animated glow */
    .glow-wrap {
      display:inline-block;
      padding:8px 18px;
      border-radius:999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      box-shadow: 0 8px 30px rgba(123,230,255,0.06), 0 0 20px rgba(255,143,177,0.04) inset;
      position:relative;
    }
    .glow {
      position:absolute;
      inset:0;
      border-radius:999px;
      z-index:-1;
      filter: blur(20px);
      opacity:0.9;
      background: radial-gradient(closest-side, rgba(255,143,177,0.15), transparent),
                  radial-gradient(closest-side, rgba(123,230,255,0.07), transparent);
      animation: glowPulse 3.6s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%{transform:scale(0.98);opacity:0.9}
      50%{transform:scale(1.03);opacity:1}
      100%{transform:scale(0.98);opacity:0.9}
    }
    .subtitle {
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    /* small animated emojis next to heading */
    .header-emojis {
      display:inline-flex;
      gap:8px;
      vertical-align:middle;
      margin-left:8px;
      transform:translateY(2px);
    }
    .header-emojis span{
      display:inline-block;
      animation: emojiBounce 2.2s ease-in-out infinite;
      font-size:1.05em;
    }
    .header-emojis span:nth-child(2){ animation-delay:0.15s }
    .header-emojis span:nth-child(3){ animation-delay:0.3s }

    @keyframes emojiBounce {
      0%{transform:translateY(0)}
      30%{transform:translateY(-8px)}
      60%{transform:translateY(0)}
      100%{transform:translateY(0)}
    }

    /* ===========================
       Decorative cake area
       =========================== */
    .cake-zone{
      width:320px;
      max-width:36vw;
      min-width:220px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:16px;
      padding:18px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));
      border: 1px solid rgba(255,255,255,0.03);
    }
    @media (max-width:900px){
      .cake-zone{width:100%;max-width:520px}
    }

    .cake {
      position:relative;
      width:220px;
      height:160px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      background: linear-gradient(180deg,#fff7,#fff0);
      color:#333;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.02) inset;
      overflow:visible;
    }

    /* use an emoji cake large & decorations */
    .cake-emoji {
      font-size:64px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.35));
    }

    /* sparkles around cake */
    .sparkle {
      position:absolute;
      width:8px;
      height:8px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent3),var(--accent1));
      box-shadow:0 0 10px rgba(255,255,255,0.6);
      opacity:0.95;
      transform-origin:center;
      animation: sparkleFloat 2.4s ease-in-out infinite;
    }
    .sparkle.small{width:6px;height:6px;box-shadow:0 0 6px rgba(255,255,255,0.5)}
    @keyframes sparkleFloat {
      0%{transform:translateY(0) scale(0.9);opacity:0.9}
      50%{transform:translateY(-10px) scale(1.1);opacity:1}
      100%{transform:translateY(0) scale(0.9);opacity:0.9}
    }

    /* ===========================
       Gift button
       =========================== */
    .gift-btn-wrap {
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      width:100%;
    }
    .btn {
      appearance:none;
      border:0;
      cursor:pointer;
      padding:14px 20px;
      border-radius:12px;
      font-size:18px;
      font-weight:600;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      color: #071428;
      box-shadow: 0 8px 24px rgba(123,230,255,0.12), 0 2px 0 rgba(255,255,255,0.08) inset;
      transition: transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s;
      touch-action: manipulation;
    }
    .btn:active{ transform:translateY(2px) scale(.997) }
    .btn:focus{ outline:3px solid rgba(123,230,255,0.18); outline-offset:3px }

    .btn.secondary {
      background: linear-gradient(90deg,var(--accent3), #ffd8c7);
      color:#1a0a00;
    }

    /* Gift CTA large mobile friendly */
    .gift-cta {
      display:flex;
      width:100%;
      justify-content:center;
    }

    /* ===========================
       Intro overlay for second section (gift)
       =========================== */
    .stage {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, rgba(2,6,23,0.45), rgba(2,6,23,0.6));
      z-index:30;
      padding:28px;
      opacity:0;
      pointer-events:none;
      transition: opacity .6s ease;
    }
    .stage.show {
      opacity:1;
      pointer-events:auto;
    }

    .gift-scene {
      width:100%;
      max-width:900px;
      border-radius:18px;
      padding:28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    /* gift box */
    .gift {
      width:320px;
      height:220px;
      position:relative;
      perspective:1000px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .box-body{
      width:260px;
      height:160px;
      background: linear-gradient(180deg,#FF5E84,#FF9ABB);
      border-radius:12px;
      position:absolute;
      bottom:0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45), 0 1px 0 rgba(255,255,255,0.05) inset;
      display:flex;
      align-items:center;
      justify-content:center;
      transform-origin: center bottom;
      transition: transform .9s cubic-bezier(.2,.9,.2,1), box-shadow .3s;
    }
    .box-body.ribbon::before, .box-body.ribbon::after{
      content:'';
      position:absolute;
      background:linear-gradient(90deg, rgba(255,255,255,0.2), rgba(0,0,0,0.05));
      border-radius:6px;
    }
    .box-body.ribbon::before{
      width:18px;height:180px;left:50%;transform:translateX(-50%);top:-10px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      background: linear-gradient(180deg,#FFD1DF,#FF6B95);
    }
    .box-body.ribbon::after{
      height:18px;width:300px;left:50%;transform:translateX(-50%);bottom:56px;
      background: linear-gradient(90deg,#FFD1DF,#FF6B95);
      border-radius:12px;
    }

    .box-lid{
      width:280px;
      height:56px;
      background: linear-gradient(180deg,#FFD9E9,#FF6F98);
      border-radius:10px;
      position:absolute;
      top:0;
      transform-origin:center;
      z-index:60;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 16px 30px rgba(0,0,0,0.45);
      transition: transform .9s cubic-bezier(.2,.9,.2,1), top .9s;
    }
    /* lid when opened */
    .gift.open .box-lid {
      transform: rotateX(75deg) translateY(-28px) scale(1.02);
      top:-36px;
    }
    .gift.open .box-body {
      transform:translateY(6px) scale(1.02);
      box-shadow: 0 36px 60px rgba(0,0,0,0.6);
    }

    /* small ribbon bow on lid */
    .bow {
      width:62px;height:28px;border-radius:20px;background:linear-gradient(90deg,#FFF3,#0002);
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:20px;color:rgba(10,6,8,0.16);transform:translateY(-2px);
      box-shadow:0 6px 12px rgba(0,0,0,0.18) inset;
    }

    /* sparkles inside opened gift */
    .inside-sparkle {
      position:absolute;
      width:10px;height:10px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent2),var(--accent1));
      box-shadow:0 0 12px rgba(255,255,255,0.75);
      animation: pop 1.6s ease-in-out forwards;
      opacity:0;
    }
    @keyframes pop {
      0%{transform:translateY(8px) scale(.6);opacity:0}
      50%{opacity:1;transform:translateY(-12px) scale(1.08)}
      100%{transform:translateY(-30px) scale(.9);opacity:0}
    }

    /* message pane */
    .message-wrap{
      width:100%;
      max-width:780px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:18px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      color:var(--muted);
      max-height:56vh;
      overflow:auto;
      font-size:15px;
      line-height:1.45;
      display:none;
    }
    .message-wrap.show{ display:block }

    /* typed line style */
    .line {
      opacity:0;
      transform: translateY(6px);
      transition: opacity .45s ease, transform .45s ease;
      white-space:pre-wrap;
    }
    .line.visible { opacity:1; transform:translateY(0) }

    /* celebrate again button */
    .celebrate-wrap {
      display:flex;
      gap:12px;
      margin-top:12px;
      align-items:center;
      justify-content:center;
    }

    /* confetti pieces (emoji) stacking layer to create burst */
    .confetti {
      position:absolute;
      font-size:20px;
      will-change: transform, opacity;
      pointer-events:none;
      text-shadow:0 4px 8px rgba(0,0,0,0.45);
    }

    /* footer small notes */
    footer{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin-top:6px;
    }
  </style>
</head>
<body>
  <!-- Emoji/Confetti background layer (behind everything) -->
  <div class="emoji-layer" aria-hidden="true"></div>

  <!-- Floating balloons background -->
  <div class="balloons" aria-hidden="true"></div>

  <!-- Main page content -->
  <main class="page" role="main">
    <section class="card" aria-labelledby="main-title">
      <!-- Hero / Heading -->
      <header class="hero" role="banner">
        <div class="glow-wrap" aria-hidden="false">
          <span class="glow" aria-hidden="true"></span>
          <h1 id="main-title" class="title">
            Happy Birthday Mahi
            <span class="header-emojis" aria-hidden="true">
              <span>🎉</span><span>🎂</span><span>✨</span>
            </span>
          </h1>
        </div>
        <p class="subtitle">Wishing you a day filled with love, laughter, and magic.</p>

        <div style="height:18px"></div>

        <div class="gift-cta" role="group" aria-label="Open gift">
          <button class="btn" id="openGiftBtn" aria-label="Open gift – Gift खोलें" type="button">
            🎁 Gift खोलें
          </button>
        </div>
      </header>

      <!-- Cake & Decorations -->
      <aside class="cake-zone" aria-hidden="false">
        <div class="cake" role="img" aria-label="Birthday cake">
          <!-- large cake emoji -->
          <div class="cake-emoji" aria-hidden="true">🎂</div>

          <!-- sparkles near cake -->
          <div class="sparkle" style="left:6%;top:14%; animation-delay:.1s"></div>
          <div class="sparkle small" style="left:85%;top:18%; animation-delay:.6s"></div>
          <div class="sparkle" style="left:50%;top:6%; animation-delay:.3s"></div>
          <div class="sparkle small" style="left:28%;top:38%; animation-delay:1.0s"></div>
        </div>

        <div style="text-align:center">
          <p style="margin:0;font-weight:700;color:var(--text)">Celebration for Mahi</p>
          <p style="margin:6px 0 0 0;color:var(--muted);font-size:13px">Tap the gift to reveal your surprise</p>
        </div>
      </aside>
    </section>

    <footer style="position:relative;z-index:12;margin-top:18px">
      <small>Made with ❤️ — Open this file in your browser to view the surprise for Mahi.</small>
    </footer>
  </main>

  <!-- Stage / Second Section: gift-open scene -->
  <div class="stage" id="giftStage" aria-hidden="true" role="dialog" aria-label="Birthday gift for Mahi">
    <div class="gift-scene" role="document">
      <!-- Gift visual -->
      <div class="gift" id="giftBox" aria-hidden="false">
        <div class="box-lid" id="boxLid">
          <div class="bow" aria-hidden="true">💝</div>
        </div>
        <div class="box-body ribbon" id="boxBody" aria-hidden="true"></div>

        <!-- sparkles that will be created dynamically -->
      </div>

      <!-- Message area (hidden until opened) -->
      <div class="message-wrap" id="messageWrap" aria-live="polite" aria-atomic="false"></div>

      <!-- Celebrate again button -->
      <div class="celebrate-wrap" style="width:100%;justify-content:center">
        <button class="btn secondary" id="celebrateAgainBtn" aria-label="Celebrate again" type="button">🎉 Celebrate Again</button>
      </div>
    </div>
  </div>

  <script>
    /*
      Birthday Surprise for Mahi
      Single-file HTML/CSS/JS with no external assets.
      - Creates falling emoji/confetti
      - Floating balloons
      - Gift opening animation with generated chime
      - Reveals a long heartfelt message (50-60 short lines) progressively
      - Accessible and mobile-friendly
    */

    (function(){
      // ---------- Utility helpers ----------
      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      // ---------- Layers references ----------
      const emojiLayer = document.querySelector('.emoji-layer');
      const balloonsLayer = document.querySelector('.balloons');
      const openGiftBtn = document.getElementById('openGiftBtn');
      const giftStage = document.getElementById('giftStage');
      const giftBox = document.getElementById('giftBox');
      const boxLid = document.getElementById('boxLid');
      const boxBody = document.getElementById('boxBody');
      const messageWrap = document.getElementById('messageWrap');
      const celebrateAgainBtn = document.getElementById('celebrateAgainBtn');

      // Z-index note:
      // emojiLayer z-index is 0, balloons z-index 1, page content z-index 10, stage z-index 30

      // ---------- Falling emoji/confetti implementation ----------
      // We'll create emoji DOM elements that fall from top to bottom smoothly using requestAnimationFrame.
      // Keep count reasonable for performance on mobile.

      const FALLING_COUNT = 28; // number of continuous falling emojis on screen
      const fallingEmojis = ['🎈','🎂','🎉','🎁','✨','🥳','💖','🌸','⭐'];
      const confettiSet = [];
      let rafId = null;

      function initFallingEmojis(){
        // Clear any existing
        emojiLayer.innerHTML = '';
        confettiSet.length = 0;
        const w = window.innerWidth;
        const h = window.innerHeight;

        for(let i=0;i<FALLING_COUNT;i++){
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.position = 'absolute';
          el.style.zIndex = 0;
          const emoji = fallingEmojis[Math.floor(Math.random()*fallingEmojis.length)];
          el.textContent = emoji;
          // random font-size
          const size = Math.round(rand(18, 36));
          el.style.fontSize = size + 'px';
          el.style.left = Math.round(rand(0, w)) + 'px';
          el.style.top = Math.round(rand(-h, -20)) + 'px';
          el.style.opacity = clamp(rand(0.6, 1.0), 0.2, 1);
          el.style.transform = `translate3d(0,0,0) rotate(${rand(0,360)}deg)`;
          // layer append
          emojiLayer.appendChild(el);

          // velocity and sway
          const velocityY = rand(30, 110); // px per second
          const sway = rand(20, 90);
          const rotationSpeed = rand(-60, 60); // deg per second

          confettiSet.push({
            el, x: parseFloat(el.style.left), y: parseFloat(el.style.top),
            vx: rand(-10,10), vy: velocityY,
            sway, rot: rand(0,360), rotationSpeed, size
          });
        }

        // ensure layer is behind content
        emojiLayer.style.zIndex = 0;
      }

      // Animation loop for falling confetti
      let lastTime = performance.now();
      function animateFalling(now){
        const dt = Math.min(40, now - lastTime) / 1000; // seconds
        lastTime = now;
        const h = window.innerHeight;
        const w = window.innerWidth;
        for(const c of confettiSet){
          // vertical movement
          c.y += c.vy * dt;
          // horizontal sway using sine wave
          c.x += Math.sin((now/1000) * rand(0.6,1.2) + c.x) * (c.sway/200) * dt * 60 + c.vx * dt;
          c.rot += c.rotationSpeed * dt;

          // wrap or reset if below screen
          if(c.y > h + 60 || c.x < -80 || c.x > w + 80){
            c.y = rand(-200, -40);
            c.x = rand(0, w);
            c.vy = rand(30,110);
            c.rotationSpeed = rand(-120,120);
            c.size = rand(18,36);
            c.el.style.fontSize = Math.round(c.size) + 'px';
            c.el.style.opacity = clamp(rand(0.5,1.0),0.28,1);
          }

          c.el.style.transform = `translate3d(${c.x}px,${c.y}px,0) rotate(${c.rot}deg)`;
        }

        rafId = requestAnimationFrame(animateFalling);
      }

      // ---------- Floating balloons in background ----------
      const BALLOON_COUNT = 8;
      const balloonEls = [];

      function initBalloons(){
        balloonsLayer.innerHTML = '';
        balloonEls.length = 0;
        const colors = ['#FF8FB1','#FFD36B','#7BE6FF','#C9A7FF','#FFB7E0','#9EF0C0'];
        for(let i=0;i<BALLOON_COUNT;i++){
          const b = document.createElement('div');
          b.className = 'balloon';
          b.textContent = '🎈';
          const size = Math.round(rand(36,72));
          b.style.fontSize = size+'px';
          // position random
          const left = Math.round(rand(6,94));
          const top = Math.round(rand(8,70));
          b.style.left = left + '%';
          b.style.top = top + '%';
          b.style.opacity = rand(0.45,0.95);
          b.style.transform = `translateX(0)`;
          b.style.animation = `floaty ${rand(4.2,7.4)}s ease-in-out ${rand(0,2)}s infinite`;
          // slight color tint using filter (since emoji is colored, we add subtle shadows)
          b.style.filter = `drop-shadow(0 6px 14px rgba(0,0,0,0.35))`;
          balloonsLayer.appendChild(b);
          balloonEls.push(b);
        }
        balloonsLayer.style.zIndex = 1;
      }

      // ---------- Gift opening, sparkles, sound ----------
      function openGift(){
        // show the stage
        giftStage.classList.add('show');
        giftStage.setAttribute('aria-hidden','false');

        // animate lid open after a small delay to make it feel real
        setTimeout(()=> {
          giftBox.classList.add('open');
          // create internal sparkles
          createInsideSparkles();

      }

      function closeGiftStage(){
        // hide message and reset
        messageWrap.classList.remove('show');
        messageWrap.innerHTML = '';

      // Create sparkles inside the gift briefly
      function createInsideSparkles(){
        // remove old sparkles
        const existing = giftBox.querySelectorAll('.inside-sparkle');
        existing.forEach(e => e.remove());
        // create several sparkles with random positions
        for(let i=0;i<14;i++){
          const s = document.createElement('div');
          s.className = 'inside-sparkle';
          s.style.left = rand(30,80) + 'px';
          s.style.bottom = rand(40,120) + 'px';
          s.style.background = `linear-gradient(135deg, hsl(${rand(250,360)}deg 90% 68%), hsl(${rand(30,120)}deg 90% 70%))`;
          s.style.animationDelay = (i*80) + 'ms';
          giftBox.appendChild(s);
          // remove after animation ends
          setTimeout(()=> s.remove(), 1800 + rand(0,400));
        }

        // also burst some confetti emojis up
        burstConfetti(giftBox.getBoundingClientRect());

      // Burst confetti upward from the gift position

        // number of pieces
        const burstCount = 26;
        for(let i=0;i<burstCount;i++){
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.fontSize = Math.round(rand(16,28)) + 'px';
          el.textContent = fallingEmojis[Math.floor(Math.random()*fallingEmojis.length)];
          el.style.left = (rect.left + rect.width/2 + rand(-60,60)) + 'px';
          el.style.top = (rect.top + rect.height/4 + rand(-20,10)) + 'px';
          el.style.opacity = 1;
          el.style.zIndex = 40;
          document.body.appendChild(el);

          // animate using CSS transitions via JS
          const angle = rand(-120, -60) * (Math.PI/180);
          const speed = rand(220,480);
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const rot = rand(-720,720);
          const duration = rand(900,1600);

          const start = performance.now();
          function step(now){
            const t = (now - start) / duration;
            if(t>=1){
              el.remove();
              return;
            }
            const progress = t;
            const x = (rect.left + rect.width/2) + vx * progress * 0.001;
            const y = (rect.top + rect.height/4) + vy * progress * 0.001 + (progress*progress*80);
            el.style.transform = `translate3d(${x - (rect.left + rect.width/2)}px, ${y - (rect.top + rect.height/4)}px, 0) rotate(${rot * progress}deg)`;
            el.style.opacity = `${1 - progress}`;
            requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }
      }

      // Generate short melodic chime using WebAudio API (no external files)
      function playChime(){
        try{
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const now = ctx.currentTime;
          const notes = [660, 880, 990, 1320];
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0, now);
          gain.connect(ctx.destination);

          let t = now;
          for(let i=0;i<notes.length;i++){
            const o = ctx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(notes[i], t);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.12 - i*0.02, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5 + i*0.06);
            o.connect(g);
            g.connect(gain);
            o.start(t);
            o.stop(t + 0.6 + i*0.12);
            t += 0.12;
          }
          // fade out master
          gain.gain.linearRampToValueAtTime(0, t + 1.2);
          // close AudioContext after short delay to free resources
          setTimeout(()=> ctx.close(), 1400);
        }catch(e){
          // Audio may be blocked or unsupported — ignore silently
          // (No console errors to user)
        }
      }

      // Ensure there are between 50-60 lines; currently we have 55 lines (count them)
      // (They're intentionally short lines as requested)

      // ---------- Reveal message gradually ----------
      let typingIndex = 0;
      function revealMessage(){
        messageWrap.innerHTML = '';
        messageWrap.classList.add('show');
        messageWrap.scrollTop = 0;
        typingIndex = 0;

        // For accessibility: announce
        messageWrap.setAttribute('aria-live', 'polite');

        // We'll type each line with a per-character typing effect, but to keep pace, we type per-line with a short character delay
        function typeNextLine(){
          if(typingIndex >= messageLines.length) return;
          const text = messageLines[typingIndex];
          const p = document.createElement('div');
          p.className = 'line';
          messageWrap.appendChild(p);

          // smooth fade-in + typing per character
          const totalChars = text.length;
          let pos = 0;
          const charDelay = clamp(8 + Math.round(420/Math.max(1,totalChars)), 6, 28); // ms between chars
          p.textContent = '';
          // reveal container scroll if needed
          const writer = setInterval(()=>{
            pos++;
            p.textContent = text.slice(0,pos);
            p.classList.add('visible');
            messageWrap.scrollTop = messageWrap.scrollHeight;
            if(pos >= totalChars){
              clearInterval(writer);
              typingIndex++;
              // short pause between lines
              setTimeout(typeNextLine, 120);
            }
          }, charDelay);
        }
        // start typing
        typeNextLine();
      }

      // ---------- Restart celebration ----------
      function restartCelebration(){
        // close stage
        closeGiftStage();
        // small delay before bringing back intro
        setTimeout(()=>{
          // restart confetti (reinitialize to new random positions)
          initFallingEmojis();
        }, 360);
      }

      // ---------- Event wiring ----------
      openGiftBtn.addEventListener('click', ()=> {
        // smoothly fade/hide the first page card while opening stage
        // animate the page card down a bit to show transition
        document.querySelector('.card').style.transform = 'translateY(6vh) scale(.985)';
        document.querySelector('.card').style.opacity = '0.24';
        // show stage after tiny delay
        setTimeout(()=> {
          openGift();
        }, 260);

        // animate closing

        document.querySelector('.card').style.transform = '';

        // small celebration confetti
        const rect = giftBox.getBoundingClientRect();
        burstConfetti(rect);
        setTimeout(restartCelebration, 420);
      });

      // Also allow clicking outside the gift scene to close (accessibility)
      giftStage.addEventListener('click', (e)=>{

          // close and return to intro
          document.querySelector('.card').style.transform = '';
          document.querySelector('.card').style.opacity = '';
          closeGiftStage();
          // restart confetti
          initFallingEmojis();
        }
      });

      // Prevent page from scrolling while stage open (touch)
      giftStage.addEventListener('touchmove', (e)=> {
        if(giftStage.classList.contains('show')) e.preventDefault();
      }, {passive:false});

      // ---------- Initialize everything ----------
      function init(){
        initBalloons();
        initFallingEmojis();
        lastTime = performance.now();
        if(rafId) cancelAnimationFrame(rafId);
        rafId = requestAnimationFrame(animateFalling);

        // Place a few decorative confetti in the card front foreground (but behind buttons)
        // Done via emojiLayer already.
      }

      // Handle resize to reposition confetti nicely
      let resizeTimer = null;
      window.addEventListener('resize', ()=> {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(()=>{
          initFallingEmojis();
        }, 220);
      });

      init();

      // Accessibility: focus open gift button on load for keyboard users
      window.addEventListener('load', ()=>{
        openGiftBtn.focus({preventScroll:true});
      });

      // Prevent accidental text selection on double-tap for mobile
      document.body.style.userSelect = 'none';

      // Ensure stage elements are hidden until needed
      giftStage.classList.remove('show');
    })();
