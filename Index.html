<!doctype html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>سالگرہ مبارک ماہی 🎉</title>
  <meta name="description" content="ماہی کے لیے خوبصورت سالگرہ کا سرپرائز — تحفہ کھولیں!" />
  <style>
    /* ===========================
       Reset & Base
       =========================== */
    :root{
      --bg1: #071225;
      --bg2: #3b2556;
      --card-bg: rgba(255,255,255,0.04);
      --accent1: #ff8fb1;
      --accent2: #7be6ff;
      --accent3: #ffd36b;
      --glass: rgba(255,255,255,0.04);
      --text: #f8fbff;
      --muted: rgba(248,251,255,0.78);
      --shadow: 0 10px 40px rgba(2,6,23,0.6);
      --radius: 16px;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family: "Noto Nastaliq Urdu", "Noto Sans", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      background:
        radial-gradient(1000px 500px at 10% 10%, rgba(255,140,165,0.06), transparent 8%),
        radial-gradient(700px 350px at 90% 90%, rgba(123,230,255,0.04), transparent 8%),
        linear-gradient(160deg, var(--bg1), var(--bg2));
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      overflow-x:hidden;
      -webkit-text-size-adjust:100%;
      -ms-text-size-adjust:100%;
    }

    /* Layers behind UI */
    .emoji-layer, .balloons {
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:0;
    }

    /* Balloons */
    .balloon {
      position:absolute;
      font-size:48px;
      opacity:0.95;
      transform-origin:center;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.35));
      will-change: transform;
    }
    @keyframes floaty {
      0% { transform: translateY(0) translateX(0) rotate(0deg); }
      50% { transform: translateY(-16px) translateX(6px) rotate(3deg); }
      100% { transform: translateY(0) translateX(0) rotate(0deg); }
    }

    /* Page layout */
    .page {
      position:relative;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:36px;
      z-index:10;
    }
    .card {
      width:100%;
      max-width:980px;
      border-radius:var(--radius);
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px) saturate(120%);
      -webkit-backdrop-filter: blur(8px) saturate(120%);
      padding:36px;
      display:flex;
      gap:22px;
      align-items:center;
      justify-content:space-between;
    }
    @media (max-width:900px){
      .card{flex-direction:column;padding:20px}
    }

    /* Heading */
    header.hero {
      flex:1;
      text-align:center;
      position:relative;
      z-index:12;
    }
    h1.title {
      margin:0 0 12px 0;
      font-size: clamp(28px, 6vw, 48px);
      line-height:1.02;
      font-weight:800;
      color:var(--text);
      letter-spacing:-0.02em;
      text-shadow:
        0 6px 30px rgba(0,0,0,0.5),
        0 0 20px rgba(255,255,255,0.02);
    }
    .glow-wrap {
      display:inline-block;
      padding:8px 18px;
      border-radius:999px;
      position:relative;
    }
    .glow {
      position:absolute;
      inset:0;
      border-radius:999px;
      z-index:-1;
      filter: blur(20px);
      opacity:0.9;
      background: radial-gradient(closest-side, rgba(255,143,177,0.12), transparent),
                  radial-gradient(closest-side, rgba(123,230,255,0.06), transparent);
      animation: glowPulse 3.6s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%{transform:scale(0.98);opacity:0.9}
      50%{transform:scale(1.03);opacity:1}
      100%{transform:scale(0.98);opacity:0.9}
    }
    .subtitle {
      margin:0;
      color:var(--muted);
      font-size:14px;
    }

    .header-emojis { display:inline-flex; gap:8px; vertical-align:middle; margin-right:8px; }
    .header-emojis span { display:inline-block; animation: emojiBounce 2.2s ease-in-out infinite; font-size:1.05em; }
    .header-emojis span:nth-child(2){ animation-delay:0.15s }
    .header-emojis span:nth-child(3){ animation-delay:0.3s }
    @keyframes emojiBounce {
      0%{transform:translateY(0)}
      30%{transform:translateY(-8px)}
      60%{transform:translateY(0)}
      100%{transform:translateY(0)}
    }

    /* Cake area */
    .cake-zone{
      width:320px;
      max-width:36vw;
      min-width:220px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:14px;
      padding:18px;
      border-radius:14px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.03);
    }
    .cake {
      position:relative;
      width:220px;
      height:160px;
      display:flex;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.45);
      overflow:visible;
    }
    .cake-emoji {
      font-size:64px;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,0.35));
    }
    .sparkle {
      position:absolute;
      width:8px;height:8px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent3),var(--accent1));
      box-shadow:0 0 10px rgba(255,255,255,0.6);
      animation: sparkleFloat 2.4s ease-in-out infinite;
    }
    .sparkle.small{width:6px;height:6px;box-shadow:0 0 6px rgba(255,255,255,0.5)}
    @keyframes sparkleFloat {
      0%{transform:translateY(0) scale(0.9);opacity:0.9}
      50%{transform:translateY(-10px) scale(1.1);opacity:1}
      100%{transform:translateY(0) scale(0.9);opacity:0.9}
    }

    /* Buttons */
    .gift-cta { display:flex; width:100%; justify-content:center; margin-top:12px; }
    .btn {
      appearance:none;
      border:0;
      cursor:pointer;
      padding:14px 20px;
      border-radius:12px;
      font-size:18px;
      font-weight:700;
      background:linear-gradient(90deg,var(--accent1),var(--accent2));
      color: #071428;
      box-shadow: 0 10px 30px rgba(123,230,255,0.12), 0 2px 0 rgba(255,255,255,0.08) inset;
      transition: transform .18s cubic-bezier(.2,.9,.3,1), box-shadow .18s;
      touch-action: manipulation;
    }
    .btn:active{ transform:translateY(2px) scale(.997) }
    .btn:focus{ outline:3px solid rgba(123,230,255,0.18); outline-offset:3px }
    .btn.secondary { background: linear-gradient(90deg,var(--accent3), #ffd8c7); color:#1a0a00; }

    /* Stage (gift scene) */
    .stage {
      position:fixed;
      inset:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background: linear-gradient(180deg, rgba(2,6,23,0.45), rgba(2,6,23,0.65));
      z-index:30;
      padding:28px;
      opacity:0;
      pointer-events:none;
      transition: opacity .6s ease;
    }
    .stage.show {
      opacity:1;
      pointer-events:auto;
    }

    .gift-scene {
      width:100%;
      max-width:900px;
      border-radius:18px;
      padding:28px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      box-shadow: 0 24px 80px rgba(0,0,0,0.6);
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
    }

    /* Gift */
    .gift {
      width:320px;
      height:220px;
      position:relative;
      perspective:1000px;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .box-body{
      width:260px;
      height:160px;
      background: linear-gradient(180deg,#FF6B95,#FFB0C9);
      border-radius:12px;
      position:absolute;
      bottom:0;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      display:flex;
      align-items:center;
      justify-content:center;
      transform-origin: center bottom;
      transition: transform .9s cubic-bezier(.2,.9,.2,1), box-shadow .3s;
    }
    .box-body.ribbon::before, .box-body.ribbon::after{
      content:'';
      position:absolute;
      border-radius:6px;
    }
    .box-body.ribbon::before{
      width:18px;height:180px;left:50%;transform:translateX(-50%);top:-10px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.2);
      background: linear-gradient(180deg,#FFD1DF,#FF6B95);
    }
    .box-body.ribbon::after{
      height:18px;width:300px;left:50%;transform:translateX(-50%);bottom:56px;
      background: linear-gradient(90deg,#FFD1DF,#FF6B95);
      border-radius:12px;
    }

    .box-lid{
      width:280px;
      height:56px;
      background: linear-gradient(180deg,#FFD9E9,#FF6F98);
      border-radius:10px;
      position:absolute;
      top:0;
      transform-origin:center;
      z-index:60;
      display:flex;
      align-items:center;
      justify-content:center;
      box-shadow: 0 16px 30px rgba(0,0,0,0.45);
      transition: transform .9s cubic-bezier(.2,.9,.2,1), top .9s;
    }
    .gift.open .box-lid {
      transform: rotateX(75deg) translateY(-28px) scale(1.02);
      top:-36px;
    }
    .gift.open .box-body {
      transform:translateY(6px) scale(1.02);
      box-shadow: 0 36px 60px rgba(0,0,0,0.6);
    }
    .bow {
      width:62px;height:28px;border-radius:20px;background:linear-gradient(90deg,#FFF3,#0002);
      display:flex;align-items:center;justify-content:center;
      font-weight:800;font-size:20px;color:rgba(10,6,8,0.16);transform:translateY(-2px);
      box-shadow:0 6px 12px rgba(0,0,0,0.18) inset;
    }

    .inside-sparkle {
      position:absolute;
      width:10px;height:10px;border-radius:50%;
      background:linear-gradient(135deg,var(--accent2),var(--accent1));
      box-shadow:0 0 12px rgba(255,255,255,0.75);
      animation: pop 1.6s ease-in-out forwards;
      opacity:0;
    }
    @keyframes pop {
      0%{transform:translateY(8px) scale(.6);opacity:0}
      50%{opacity:1;transform:translateY(-12px) scale(1.08)}
      100%{transform:translateY(-30px) scale(.9);opacity:0}
    }

    /* Message */
    .message-wrap{
      width:100%;
      max-width:780px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;
      padding:18px 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.45);
      color:var(--muted);
      max-height:56vh;
      overflow:auto;
      font-size:17px;
      line-height:1.6;
      display:none;
      direction:rtl;
      text-align:right;
    }
    .message-wrap.show{ display:block }

    .line {
      opacity:0;
      transform: translateY(6px);
      transition: opacity .45s ease, transform .45s ease;
      white-space:pre-wrap;
      margin:6px 0;
    }
    .line.visible { opacity:1; transform:translateY(0) }

    .celebrate-wrap {
      display:flex;
      gap:12px;
      margin-top:8px;
      align-items:center;
      justify-content:center;
    }

    .confetti {
      position:absolute;
      font-size:20px;
      will-change: transform, opacity;
      pointer-events:none;
      text-shadow:0 4px 8px rgba(0,0,0,0.45);
    }

    footer{
      text-align:center;
      color:var(--muted);
      font-size:13px;
      margin-top:10px;
      z-index:12;
    }

    /* Accessibility: larger tap target on mobile */
    @media (max-width:640px){
      .btn { padding:16px 22px; font-size:18px; border-radius:14px; }
      .cake-emoji{ font-size:56px }
    }
  </style>
</head>
<body>
  <!-- Background emoji/confetti layer -->
  <div class="emoji-layer" aria-hidden="true"></div>

  <!-- Floating balloons -->
  <div class="balloons" aria-hidden="true"></div>

  <!-- Main content -->
  <main class="page" role="main">
    <section class="card" aria-labelledby="main-title">
      <header class="hero" role="banner">
        <div class="glow-wrap" aria-hidden="false">
          <span class="glow" aria-hidden="true"></span>
          <h1 id="main-title" class="title">
            سالگرہ مبارک، ماہی
            <span class="header-emojis" aria-hidden="true">
              <span>🎉</span><span>🎂</span><span>✨</span>
            </span>
          </h1>
        </div>
        <p class="subtitle">آپ کے دن میں خوشیاں، محبت اور جادو بھر جائے۔</p>

        <div class="gift-cta" role="group" aria-label="تحفہ کھولیں">
          <button class="btn" id="openGiftBtn" aria-label="تحفہ کھولیں – 🎁" type="button">
            🎁 تحفہ کھولیں
          </button>
        </div>
      </header>

      <aside class="cake-zone" aria-hidden="false">
        <div class="cake" role="img" aria-label="سالگرہ کا کیک">
          <div class="cake-emoji" aria-hidden="true">🎂</div>
          <div class="sparkle" style="left:6%;top:14%; animation-delay:.1s"></div>
          <div class="sparkle small" style="left:85%;top:18%; animation-delay:.6s"></div>
          <div class="sparkle" style="left:50%;top:6%; animation-delay:.3s"></div>
          <div class="sparkle small" style="left:28%;top:38%; animation-delay:1.0s"></div>
        </div>

        <div style="text-align:center;direction:rtl">
          <p style="margin:0;font-weight:800;color:var(--text)">ماہی کے لیے جشن</p>
          <p style="margin:6px 0 0 0;color:var(--muted);font-size:13px">تحفہ کھولیں اور سرپرائز دیکھیں</p>
        </div>
      </aside>
    </section>

    <footer style="position:relative;z-index:12;margin-top:18px">
      <small>یہ فائل براہِ راست اپنے براؤزر میں کھولیں — ماہی کے لیے مبارکباد!</small>
    </footer>
  </main>

  <!-- Gift stage -->
  <div class="stage" id="giftStage" aria-hidden="true" role="dialog" aria-label="ماہی کے لیے تحفہ">
    <div class="gift-scene" role="document">
      <div class="gift" id="giftBox" aria-hidden="false">
        <div class="box-lid" id="boxLid">
          <div class="bow" aria-hidden="true">💝</div>
        </div>
        <div class="box-body ribbon" id="boxBody" aria-hidden="true"></div>
      </div>

      <div class="message-wrap" id="messageWrap" aria-live="polite" aria-atomic="false"></div>

      <div class="celebrate-wrap" style="width:100%;justify-content:center">
        <button class="btn secondary" id="celebrateAgainBtn" aria-label="دوبارہ جشن منائیں" type="button">🎉 دوبارہ جشن منائیں</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // Utility
      const rand = (min, max) => Math.random() * (max - min) + min;
      const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

      // Elements
      const emojiLayer = document.querySelector('.emoji-layer');
      const balloonsLayer = document.querySelector('.balloons');
      const openGiftBtn = document.getElementById('openGiftBtn');
      const giftStage = document.getElementById('giftStage');
      const giftBox = document.getElementById('giftBox');
      const messageWrap = document.getElementById('messageWrap');
      const celebrateAgainBtn = document.getElementById('celebrateAgainBtn');

      // Falling emojis settings
      const FALLING_COUNT = 28;
      const fallingEmojis = ['🎈','🎂','🎉','🎁','✨','🥳','💖','🌸','⭐'];
      const confettiSet = [];
      let rafId = null;

      function initFallingEmojis(){
        emojiLayer.innerHTML = '';
        confettiSet.length = 0;
        const w = window.innerWidth;
        const h = window.innerHeight;
        for(let i=0;i<FALLING_COUNT;i++){
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.position = 'absolute';
          el.style.zIndex = 0;
          const emoji = fallingEmojis[Math.floor(Math.random()*fallingEmojis.length)];
          el.textContent = emoji;
          const size = Math.round(rand(18, 36));
          el.style.fontSize = size + 'px';
          el.style.left = Math.round(rand(0, w)) + 'px';
          el.style.top = Math.round(rand(-h, -20)) + 'px';
          el.style.opacity = clamp(rand(0.6, 1.0), 0.2, 1);
          el.style.transform = `translate3d(0,0,0) rotate(${rand(0,360)}deg)`;
          emojiLayer.appendChild(el);

          const velocityY = rand(30, 110);
          const sway = rand(20, 90);
          const rotationSpeed = rand(-60, 60);

          confettiSet.push({
            el, x: parseFloat(el.style.left), y: parseFloat(el.style.top),
            vx: rand(-10,10), vy: velocityY,
            sway, rot: rand(0,360), rotationSpeed, size
          });
        }
        emojiLayer.style.zIndex = 0;
      }

      let lastTime = performance.now();
      function animateFalling(now){
        const dt = Math.min(40, now - lastTime) / 1000;
        lastTime = now;
        const h = window.innerHeight;
        const w = window.innerWidth;
        for(const c of confettiSet){
          c.y += c.vy * dt;
          c.x += Math.sin((now/1000) * rand(0.6,1.2) + c.x) * (c.sway/200) * dt * 60 + c.vx * dt;
          c.rot += c.rotationSpeed * dt;

          if(c.y > h + 60 || c.x < -80 || c.x > w + 80){
            c.y = rand(-200, -40);
            c.x = rand(0, w);
            c.vy = rand(30,110);
            c.rotationSpeed = rand(-120,120);
            c.size = rand(18,36);
            c.el.style.fontSize = Math.round(c.size) + 'px';
            c.el.style.opacity = clamp(rand(0.5,1.0),0.28,1);
          }

          c.el.style.transform = `translate3d(${c.x}px,${c.y}px,0) rotate(${c.rot}deg)`;
        }

        rafId = requestAnimationFrame(animateFalling);
      }

      // Balloons
      const BALLOON_COUNT = 8;
      function initBalloons(){
        balloonsLayer.innerHTML = '';
        for(let i=0;i<BALLOON_COUNT;i++){
          const b = document.createElement('div');
          b.className = 'balloon';
          b.textContent = '🎈';
          const size = Math.round(rand(36,72));
          b.style.fontSize = size+'px';
          const left = Math.round(rand(6,94));
          const top = Math.round(rand(8,70));
          b.style.left = left + '%';
          b.style.top = top + '%';
          b.style.opacity = rand(0.45,0.95);
          b.style.animation = `floaty ${rand(4.2,7.4)}s ease-in-out ${rand(0,2)}s infinite`;
          balloonsLayer.appendChild(b);
        }
        balloonsLayer.style.zIndex = 1;
      }

      // Gift open sequence
      function openGift(){
        giftStage.classList.add('show');
        giftStage.setAttribute('aria-hidden','false');

        setTimeout(()=> {
          giftBox.classList.add('open');
          createInsideSparkles();
          playChime();
          setTimeout(()=> {
            revealMessage();
          }, 900);
        }, 240);
      }

      function closeGiftStage(){
        messageWrap.classList.remove('show');
        messageWrap.innerHTML = '';
        giftBox.classList.remove('open');
        giftStage.classList.remove('show');
        giftStage.setAttribute('aria-hidden','true');
      }

      function createInsideSparkles(){
        const existing = giftBox.querySelectorAll('.inside-sparkle');
        existing.forEach(e => e.remove());
        for(let i=0;i<14;i++){
          const s = document.createElement('div');
          s.className = 'inside-sparkle';
          s.style.left = rand(30,80) + 'px';
          s.style.bottom = rand(40,120) + 'px';
          s.style.background = `linear-gradient(135deg, hsl(${rand(250,360)}deg 90% 68%), hsl(${rand(30,120)}deg 90% 70%))`;
          s.style.animationDelay = (i*80) + 'ms';
          giftBox.appendChild(s);
          setTimeout(()=> s.remove(), 1800 + rand(0,400));
        }
        burstConfetti(giftBox.getBoundingClientRect());
      }

      function burstConfetti(rect){
        const burstCount = 26;
        for(let i=0;i<burstCount;i++){
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.fontSize = Math.round(rand(16,28)) + 'px';
          el.textContent = fallingEmojis[Math.floor(Math.random()*fallingEmojis.length)];
          el.style.left = (rect.left + rect.width/2 + rand(-60,60)) + 'px';
          el.style.top = (rect.top + rect.height/4 + rand(-20,10)) + 'px';
          el.style.opacity = 1;
          el.style.zIndex = 40;
          document.body.appendChild(el);

          const angle = rand(-120, -60) * (Math.PI/180);
          const speed = rand(220,480);
          const vx = Math.cos(angle) * speed;
          const vy = Math.sin(angle) * speed;
          const rot = rand(-720,720);
          const duration = rand(900,1600);

          const start = performance.now();
          function step(now){
            const t = (now - start) / duration;
            if(t>=1){
              el.remove();
              return;
            }
            const progress = t;
            const x = (rect.left + rect.width/2) + vx * progress * 0.001;
            const y = (rect.top + rect.height/4) + vy * progress * 0.001 + (progress*progress*80);
            el.style.transform = `translate3d(${x - (rect.left + rect.width/2)}px, ${y - (rect.top + rect.height/4)}px, 0) rotate(${rot * progress}deg)`;
            el.style.opacity = `${1 - progress}`;
            requestAnimationFrame(step);
          }
          requestAnimationFrame(step);
        }
      }

      // Sound: synthesized chime
      function playChime(){
        try{
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const now = ctx.currentTime;
          const notes = [660, 880, 990, 1320];
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0, now);
          gain.connect(ctx.destination);

            const o = ctx.createOscillator();
            o.type = 'sine';
            o.frequency.setValueAtTime(notes[i], t);
            const g = ctx.createGain();
            g.gain.setValueAtTime(0, t);
            g.gain.linearRampToValueAtTime(0.12 - i*0.02, t + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5 + i*0.06);
            o.connect(g);
            g.connect(gain);
            o.start(t);
            o.stop(t + 0.6 + i*0.12);
            t += 0.12;
          }
          gain.gain.linearRampToValueAtTime(0, t + 1.2);
          setTimeout(()=> ctx.close(), 1400);
        }catch(e){
          // ignore
        }

      // Reveal message with typing-like animation
      let typingIndex = 0;
      function revealMessage(){
        messageWrap.innerHTML = '';
        messageWrap.classList.add('show');
        messageWrap.scrollTop = 0;
        typingIndex = 0;
        messageWrap.setAttribute('aria-live', 'polite');

        function typeNextLine(){
          if(typingIndex >= messageLines.length) return;
          const text = messageLines[typingIndex];
          const p = document.createElement('div');
          p.className = 'line';
          messageWrap.appendChild(p);

          const totalChars = text.length;
          let pos = 0;
          const charDelay = clamp(8 + Math.round(420/Math.max(1,totalChars)), 6, 28);
          p.textContent = '';
          const writer = setInterval(()=>{
            pos++;
            p.textContent = text.slice(0,pos);
            p.classList.add('visible');
            messageWrap.scrollTop = messageWrap.scrollHeight;
            if(pos >= totalChars){
              clearInterval(writer);
              typingIndex++;
              setTimeout(typeNextLine, 120);
            }
          }, charDelay);
        }
        typeNextLine();
      }

        closeGiftStage();
